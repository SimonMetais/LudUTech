<div class="grid grid-cols-2 gap-4 text-sm mb-6">
    <div class="bg-gray-50 p-3 rounded-lg">
        <span class="block text-gray-500 text-xs uppercase font-semibold mb-1">Auteur</span>
        <span class="text-gray-900 font-bold">{{ object.author }}</span>
    </div>
    <div class="bg-gray-50 p-3 rounded-lg">
        <span class="block text-gray-500 text-xs uppercase font-semibold mb-1">ISBN</span>
        <span class="text-gray-900 font-bold text-xs">{{ object.isbn }}</span>
    </div>
    <div class="bg-gray-50 p-3 rounded-lg">
        <span class="block text-gray-500 text-xs uppercase font-semibold mb-1">Pages</span>
        <span class="text-gray-900 font-bold">{{ object.nb_pages }}</span>
    </div>
    <div class="bg-gray-50 p-3 rounded-lg">
        <span class="block text-gray-500 text-xs uppercase font-semibold mb-1">Éditeur</span>
        <span class="text-gray-900 font-bold">{{ object.publisher }}</span>
    </div>
</div>
