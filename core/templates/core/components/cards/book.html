<div class="bg-white rounded-lg shadow-sm border overflow-hidden hover:shadow-md transition flex flex-col h-full">
    <div class="h-48 bg-gray-50 overflow-hidden relative">
        {% if object.cover_image %}
            <img src="{{ object.cover_image.url }}" alt="{{ object.title }}" class="w-full h-full object-contain">
        {% else %}
            <div class="flex items-center justify-center h-full text-gray-400">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
            </div>
        {% endif %}
        {% if object.rating %}
            <span class="absolute top-2 left-2 px-2 py-1 text-xs font-semibold rounded bg-yellow-100/90 text-yellow-800">
                {{ object.rating }} / 10
            </span>
        {% endif %}
    </div>
    <div class="p-6 flex flex-col flex-grow">
        <h3 class="text-xl font-bold text-gray-900 leading-tight mb-2 truncate" title="{{ object.title }}">{{ object.title }}</h3>
        <p class="text-sm text-gray-600 mb-4">Par {{ object.author }}</p>

        <div class="flex items-center text-sm text-gray-600 mb-6 space-x-4 mt-auto">
            <span>📖 {{ object.nb_pages }} pages</span>
            <span title="Éditeur">🏢 {{ object.publisher }}</span>
        </div>

        <a href="{{ object.get_absolute_url }}" class="block w-full text-center bg-gray-900 text-white px-4 py-2 rounded hover:bg-black transition text-sm font-semibold">
            Voir plus / Réserver
        </a>
    </div>
</div>
