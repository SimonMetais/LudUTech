<div class="flex flex-col flex-grow">
    <div class="flex flex-wrap gap-1 mb-4 h-12 overflow-hidden content-start">
        {% for type in object.game_types.all %}
        <span class="bg-gray-100 text-gray-600 px-2 py-0.5 rounded text-xs">{{ type.name }}</span>
        {% endfor %}
    </div>

    <div class="flex items-center text-sm text-gray-600 mb-4 space-x-4 mt-auto">
        <span title="Nombre de joueurs">👥 {{ object.players_min }}-{{ object.players_max }}</span>
        <span title="Âge minimum">🎂 {{ object.min_age }}+</span>
        <span title="Difficulté">⭐ {{ object.get_difficulty_display }}</span>
    </div>
    
    <div class="flex flex-wrap gap-1">
        {% for mode in object.play_modes.all %}
            <span class="text-indigo-600 font-semibold text-xs">{{ mode }}</span>
        {% endfor %}
    </div>
</div>
