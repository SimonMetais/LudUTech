<div class="bg-white rounded-lg shadow-sm border overflow-hidden hover:shadow-md transition flex flex-col h-full">
    <div class="h-48 bg-gray-50 overflow-hidden relative">
        {% if object.cover_image %}
            <img src="{{ object.cover_image.url }}" alt="{{ object.title }}" class="w-full h-full object-contain">
        {% else %}
            <div class="flex items-center justify-center h-full text-gray-400">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h14a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
        {% endif %}
    </div>
    <div class="p-6 flex flex-col flex-grow">
        <h3 class="text-xl font-bold text-gray-900 leading-tight mb-2 truncate">{{ object.title }}</h3>
        <p class="text-sm text-gray-600 mb-4 line-clamp-3">{{ object.short_description }}</p>
        <a href="{{ object.get_absolute_url }}" class="mt-auto block w-full text-center bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition text-sm font-semibold">
            Voir les détails
        </a>
    </div>
</div>
