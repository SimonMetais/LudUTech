<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JDSU - Ludothèque{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
    <nav class="bg-white shadow-sm border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="{% url 'home' %}" class="text-2xl font-bold text-indigo-600">JDSU</a>
                    </div>
                    <div class="flex items-center ml-4">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="site-mode-checkbox" class="sr-only peer" {% if site_mode %}checked{% endif %}>
                            <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                            <span class="ms-3 text-sm font-medium text-gray-900">mode sur site</span>
                        </label>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        {% for item in nav_oeuvres %}
                        <a href="{% url 'oeuvre_list' item.url_name %}" 
                           class="inline-flex items-center px-1 pt-1 border-b-2 {% if request.resolver_match.kwargs.model_name == item.url_name or request.resolver_match.url_name == 'game_list' and item.url_name == 'game' %}border-indigo-500 text-gray-900{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700{% endif %} text-sm font-medium">
                            {{ item.name }}
                        </a>
                        {% endfor %}
                        <a href="{% url 'reservation_list' %}" class="inline-flex items-center px-1 pt-1 border-b-2 {% if request.resolver_match.url_name == 'reservation_list' %}border-indigo-500 text-gray-900{% else %}border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700{% endif %} text-sm font-medium">
                            Réservations
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    <a href="/admin/" class="text-sm text-gray-500 hover:text-gray-700">Admin</a>
                </div>
            </div>
        </div>
    </nav>
    
    {% if messages %}
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
        {% for message in messages %}
        <div class="p-4 rounded-lg {% if message.tags == 'success' %}bg-green-100 text-green-800 border border-green-200{% elif message.tags == 'error' %}bg-red-100 text-red-800 border border-red-200{% else %}bg-blue-100 text-blue-800 border border-blue-200{% endif %} flex justify-between items-center shadow-sm">
            <span>{{ message }}</span>
            <button onclick="this.parentElement.remove()" class="text-current hover:opacity-75">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-gray-500 text-sm">© 2026 JDSU - Système de gestion de ludothèque</p>
        </div>
    </footer>
    <script>
        document.getElementById('site-mode-checkbox').addEventListener('change', function() {
            const url = new URL(window.location.href);
            if (this.checked) {
                url.searchParams.set('site_mode', '1');
            } else {
                url.searchParams.set('site_mode', '0');
            }
            window.location.href = url.toString();
        });
    </script>
</body>
</html>
